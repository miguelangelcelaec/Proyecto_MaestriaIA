<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Panel STLF · EEASA{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="scanlines" aria-hidden="true"></div>

<header class="topbar">
  <a href="{{ url_for('index') }}" class="brand">
    <span class="brand-mark">⏦</span>
    <span class="brand-text">
      <span class="brand-title">PANEL STLF</span>
      <span class="brand-sub">EEASA · Tungurahua</span>
    </span>
  </a>
  <nav class="topnav">
    <a href="{{ url_for('index') }}" class="{{ 'active' if request.endpoint == 'index' else '' }}">Resumen</a>
  </nav>
  <div class="topbar-status">
    <span class="dot dot-live"></span>
    <span>Modelo v4 · corrector residual</span>
  </div>
</header>

<main class="content">
  {% block content %}{% endblock %}
</main>

<footer class="sitefooter">
  <span>Pronóstico de carga a corto plazo (STLF) · LSTM v1 vs. v4 · horizonte 1h</span>
  <span>Datos SCADA EEASA 2016–2025 · 15 min</span>
</footer>

<script src="{{ url_for('static', filename='js/chart.umd.min.js') }}"></script>
<script src="{{ url_for('static', filename='js/gauge.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
